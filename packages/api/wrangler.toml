name = "bondvault-api"
main = "src/index.ts"
compatibility_date = "2025-06-09"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "bondvault-db"
database_id = ""

[[kv_namespaces]]
binding = "KV"
id = ""

[[r2_buckets]]
binding = "R2"
bucket_name = "bondvault-storage"

[[queues.producers]]
queue = "match-queue"
binding = "MATCH_QUEUE"

[[queues.producers]]
queue = "notification-queue"
binding = "NOTIFICATION_QUEUE"

[[queues.producers]]
queue = "cleanup-queue"
binding = "CLEANUP_QUEUE"

[[queues.producers]]
queue = "draw-queue"
binding = "DRAW_QUEUE"

[env.production]
[env.production.vars]
BETTER_AUTH_SECRET = ""
ENVIRONMENT = "production"
