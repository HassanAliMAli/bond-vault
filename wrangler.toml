name = "bondvault"
compatibility_date = "2025-10-01"
main = ".open-next/worker.js"

compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "bondvault-production-v2"
database_id = "2fc28994-8da8-4bfd-aa55-aeaf5b54701e"

[[kv_namespaces]]
binding = "KV"
id = "e52470a5785a4ee390df6a979ba30210"

[[r2_buckets]]
binding = "R2"
bucket_name = "bondvault-assets"

[vars]
ENVIRONMENT = "production"
