name = "bondvault"
compatibility_date = "2025-10-01"
main = "worker.ts"

compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "bondvault-production-v2"
database_id = "2fc28994-8da8-4bfd-aa55-aeaf5b54701e"

[[kv_namespaces]]
binding = "KV"
id = "e52470a5785a4ee390df6a979ba30210"

[[r2_buckets]]
binding = "R2"
bucket_name = "bondvault-assets"

[[queues.producers]]
binding = "MatchGenerationQueue"
queue = "match-generation"

[[queues.consumers]]
queue = "match-generation"

[[queues.producers]]
binding = "NotificationDeliveryQueue"
queue = "notification-delivery"

[[queues.consumers]]
queue = "notification-delivery"

[[queues.producers]]
binding = "DrawProcessingQueue"
queue = "draw-processing"

[[queues.consumers]]
queue = "draw-processing"

[[queues.producers]]
binding = "CleanupJobsQueue"
queue = "cleanup-jobs"

[[queues.consumers]]
queue = "cleanup-jobs"

[vars]
ENVIRONMENT = "production"
